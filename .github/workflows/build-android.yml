name: Build Android App (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build APK (Telefonda test qilish uchun)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Build AAB (Google Play Market uchun)
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Oquv-Markaz-Test-App.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Oquv-Markaz-PlayStore.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
