name: Build Android App (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and Play Store AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build APK (Telefonda test qilish uchun)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Build AAB (Google Play Market uchun)
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Prepare Direct Files
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk Oquv-Markaz.apk
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab Oquv-Markaz.aab

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Oquv-Markaz-Test-App.apk
          path: Oquv-Markaz.apk
          retention-days: 14

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Oquv-Markaz-PlayStore.aab
          path: Oquv-Markaz.aab
          retention-days: 14

      - name: Publish Direct APK & AAB to Releases (Zip-siz to'g'ridan-to'g'ri)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-app
          name: "O'quv Markaz Android App (Eng so'nggi versiya)"
          body: "Telefonga to'g'ridan-to'g'ri o'rnatiladigan rasmiy APK va Google Play Store uchun AAB fayllar."
          draft: false
          prerelease: false
          files: |
            Oquv-Markaz.apk
            Oquv-Markaz.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
